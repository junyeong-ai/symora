name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No build cache here on purpose: this workflow publishes the release
      # binaries, and a poisoned cache entry would flow straight into them.
      # Cold release builds are rare enough to eat the extra minutes.
      - name: Install cross
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cross

      - name: Build binary
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$MATRIX_OS" = "ubuntu-latest" ]; then
            cross build --release --target "$MATRIX_TARGET"
          else
            cargo build --release --target "$MATRIX_TARGET"
          fi

      - name: Package binary
        shell: bash
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF#refs/tags/v}"
          binary="target/${MATRIX_TARGET}/release/symora"
          archive="symora-v${version}-${MATRIX_TARGET}.tar.gz"
          cp "$binary" symora
          tar -czf "$archive" symora
          {
            echo "ASSET=${archive}"
            echo "VERSION=${version}"
          } >> "$GITHUB_ENV"

      - name: Generate checksum
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release/symora-*.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
