[package]
name = "symora"
version = "0.13.0"
edition = "2024"
rust-version = "1.96"
description = "Symbol-centric code intelligence CLI for AI coding agents"
license = "MIT"
repository = "https://github.com/junyeong-ai/symora"
homepage = "https://github.com/junyeong-ai/symora"
documentation = "https://docs.rs/symora"
readme = "README.md"
authors = ["junyeong-ai"]
keywords = ["cli", "lsp", "symbol", "code-intelligence", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "symora"
path = "src/main.rs"

[features]
default = []
# Optional local embeddings backend (ONNX via fastembed-rs) — adds the
# natural-language `search semantic` command. Off by default: the dependency
# tree is large (ort + tokenizers) and the default SQLite symbol/substring
# search covers most navigation without it.
# Enable with: `cargo install symora --features embeddings`.
embeddings = ["dep:fastembed"]

[dependencies]
# Async runtime — tracked on the latest tokio 1.x. Minor bumps are
# semver-compatible and gated by the test suite; 2.0 is a deliberate migration.
tokio = { version = "1.52", features = ["full", "process", "sync"] }
futures = "0.3.32"

# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps JSON object key order on round-trip (structs already
# serialize in declaration order; this only affects `Value` maps), so the MCP
# installer never reshuffles a user's existing config keys.
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_repr = "0.1.20"
toml = "1.1"
# Format-preserving TOML edits (comments, ordering, all table forms) for the
# MCP installer's Codex config — the canonical crate for surgical TOML editing.
toml_edit = "0.22"

# Error Handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# AST Parsing
tree-sitter = "0.26.8"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25.1"
tree-sitter-rust = "0.24.2"
tree-sitter-php = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-lua = "0.5"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-swift = "0.7.2"
tree-sitter-scala = "0.26.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-dart = "0.2.0"
tree-sitter-hcl = "1.1.0"
streaming-iterator = "0.1.9"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utilities
dirs = "6.0"
walkdir = "2.5"
async-trait = "0.1.89"
ignore = "0.4.25"

# HTTP transport for the MCP server (`symora mcp serve --transport http`).
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }

# SQLite (symbol/content indexing). The async adapter is in-house
# (services/store/db.rs: one owner thread + channel), so the driver is a
# direct dependency and tracks upstream on our schedule.
rusqlite = { version = "0.40", features = ["bundled"] }

# Optional local embeddings (gated behind the `embeddings` feature).
fastembed = { version = "5.16", optional = true }

# Unix file locking (for daemon)
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

# jemalloc on Linux/macOS: cuts fragmentation across SQLite batches and the
# LSP fan-out arena. cfg-gated because the upstream crate doesn't build on
# Windows or wasm.
[target.'cfg(all(not(target_env = "msvc"), not(target_os = "windows")))'.dependencies]
tikv-jemallocator = "0.7.0"

[dev-dependencies]
tempfile = "3.27"
tokio-test = "0.4.5"
insta = { version = "1.47", features = ["json", "redactions"] }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "pack"
harness = false

[[bench]]
name = "errors"
harness = false

[[bench]]
name = "blast_radius"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
