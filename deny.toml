[output]
feature-depth = 1

[advisories]
yanked = "deny"
# Unmaintained crates are denied wherever they sit in the tree: a transitive
# one ships in the binary as surely as a direct one, and scoping the check to
# direct dependencies is what kept chrono (RUSTSEC-2026-0543) unreported.
unmaintained = "all"

[licenses]
confidence-threshold = 0.95
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]


[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
